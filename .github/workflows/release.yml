name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Test, build, verify, and attach distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/verify_release_artifacts.py tag \
            --project pyproject.toml \
            --tag "$RELEASE_TAG"

      - name: Install build frontend
        run: python -m pip install "build>=1.2,<2"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Extract and inspect source distribution
        run: |
          mkdir -p "${{ runner.temp }}/verb-authority-sdist"
          sdist_archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist_archive"
          tar -xzf "$sdist_archive" -C "${{ runner.temp }}/verb-authority-sdist"
          sdist_root=$(find "${{ runner.temp }}/verb-authority-sdist" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$sdist_root"
          test -f "$sdist_root/LANDSCAPE.md"
          test -f "$sdist_root/docs/assets/social-preview.png"
          test -f "$sdist_root/scripts/installed_wheel_smoke.py"
          test -f "$sdist_root/scripts/verify_release_artifacts.py"
          printf 'SDIST_ROOT=%s\n' "$sdist_root" >> "$GITHUB_ENV"

      - name: Test extracted source distribution
        run: |
          python -m pip install "$SDIST_ROOT[dev]"
          cd "$SDIST_ROOT"
          python -m pytest -v

      - name: Build wheel from extracted source distribution
        run: python -m build --wheel --outdir "${{ github.workspace }}/dist" "$SDIST_ROOT"

      - name: Verify release distribution identities
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python "$SDIST_ROOT/scripts/verify_release_artifacts.py" artifacts \
            --project "$SDIST_ROOT/pyproject.toml" \
            --dist "${{ github.workspace }}/dist" \
            --tag "$RELEASE_TAG"

      - name: Generate and verify SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install and smoke-test the wheel
        run: |
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Exercise installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m verb_authority
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority scan --help
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority-scan "$SDIST_ROOT/fixtures/avp9_nexus_financial_tool.json" \
            --controls "$SDIST_ROOT/fixtures/avp9_nexus_financial_controls.json" \
            --format json --output authority-report.json
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority diff authority-report.json authority-report.json \
            --fail-on-increase
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority-diff authority-report.json authority-report.json \
            --format json --output authority-diff.json
          cp "$SDIST_ROOT/scripts/installed_wheel_smoke.py" installed_wheel_smoke.py
          expected_version=$(env -u PYTHONPATH -u PYTHONHOME python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$SDIST_ROOT/pyproject.toml")
          env -u PYTHONPATH -u PYTHONHOME \
            python -I installed_wheel_smoke.py \
            --expected-version "$expected_version" \
            --forbid-root "${{ github.workspace }}" \
            --forbid-root "$SDIST_ROOT"
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -c 'import json; report = json.load(open("authority-report.json")); arguments = {item["name"]: item for item in report["declared_controls"]["tools"][0]["arguments"]}; assert arguments["bidWei"]["authority"] == "constrained"'
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -c 'import json; assert json.load(open("authority-diff.json"))["summary"]["changes"] == 0'
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m pip check

      - name: Preserve release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error

      - name: Attach verified assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel_name=$(basename dist/*.whl)
          sdist_name=$(basename dist/*.tar.gz)
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            while IFS= read -r asset_name; do
              case "$asset_name" in
                "$wheel_name"|"$sdist_name"|SHA256SUMS) ;;
                *)
                  echo "unexpected pre-existing release asset: $asset_name" >&2
                  exit 2
                  ;;
              esac
            done
          gh release upload "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --clobber
