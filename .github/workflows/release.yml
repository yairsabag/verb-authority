name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Test, build, verify, and attach distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install "build>=1.2,<2" "pytest>=8,<10"

      - name: Run complete test suite
        run: python -m pytest -v

      - name: Build source and wheel distributions
        run: python -m build

      - name: Generate and verify SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install and smoke-test the wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Exercise installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m verb_authority
          verb-authority scan --help
          verb-authority-scan "${{ github.workspace }}/fixtures/avp9_nexus_financial_tool.json" \
            --controls "${{ github.workspace }}/fixtures/avp9_nexus_financial_controls.json" \
            --format json --output authority-report.json
          verb-authority diff authority-report.json authority-report.json \
            --fail-on-increase
          verb-authority-diff authority-report.json authority-report.json \
            --format json --output authority-diff.json
          python - <<'PY'
          from verb_authority import GuardedToolRunner, Param, Registry, Risk, Tool, TrustedChoice, TrustedResolver
          resolution = TrustedResolver([TrustedChoice("Dana", "dana@company.com", "directory")]).resolve("dana")
          calls = []
          registry = Registry()
          registry.add(Tool("send_email", [Param("to", "email"), Param("body")], fn=lambda to, body: calls.append((to, body)) or "sent", risk=Risk.WRITE))
          result = GuardedToolRunner(registry).run({"name": "send_email", "input": {"to": resolution.value, "body": "hello"}}, trusted_args={"to": resolution.value})
          assert resolution.resolved and result.executed and calls == [("dana@company.com", "hello")]
          PY
          python -c 'import json; report = json.load(open("authority-report.json")); arguments = {item["name"]: item for item in report["declared_controls"]["tools"][0]["arguments"]}; assert arguments["bidWei"]["authority"] == "constrained"'
          python -c 'import json; assert json.load(open("authority-diff.json"))["summary"]["changes"] == 0'
          python -m pip check

      - name: Preserve release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error

      - name: Attach verified assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
