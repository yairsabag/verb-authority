name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: python -m pip install ".[dev]"

      - name: Run complete test suite
        run: python -m pytest -v

  package:
    name: Build and smoke-test distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install "build>=1.2,<2"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Verify source distribution before extraction
        run: |
          python scripts/verify_release_artifacts.py sdist \
            --project pyproject.toml \
            --dist dist

      - name: Extract and inspect source distribution
        run: |
          mkdir -p "${{ runner.temp }}/verb-authority-sdist"
          sdist_archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist_archive"
          tar -xzf "$sdist_archive" -C "${{ runner.temp }}/verb-authority-sdist"
          sdist_root=$(find "${{ runner.temp }}/verb-authority-sdist" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$sdist_root"
          test -f "$sdist_root/LANDSCAPE.md"
          test -f "$sdist_root/docs/assets/social-preview.png"
          test -f "$sdist_root/scripts/installed_wheel_smoke.py"
          test -f "$sdist_root/scripts/verify_release_artifacts.py"
          printf 'SDIST_ROOT=%s\n' "$sdist_root" >> "$GITHUB_ENV"

      - name: Test extracted source distribution
        run: |
          python -m pip install "$SDIST_ROOT[dev]"
          cd "$SDIST_ROOT"
          python -m pytest -v

      - name: Build wheel from extracted source distribution
        run: python -m build --wheel --outdir "${{ github.workspace }}/dist" "$SDIST_ROOT"

      - name: Verify distribution identities
        run: |
          python "$SDIST_ROOT/scripts/verify_release_artifacts.py" artifacts \
            --project "$SDIST_ROOT/pyproject.toml" \
            --dist "${{ github.workspace }}/dist"

      - name: Generate and verify SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install the built wheel
        run: |
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Smoke-test installed commands
        working-directory: ${{ runner.temp }}
        run: |
          printf '%s\n' \
            'from pathlib import Path' \
            'Path("installed-smoke-shadow.marker").write_text("temp module imported", encoding="utf-8")' \
            'raise SystemExit(0)' \
            > verb_authority.py
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m verb_authority
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority scan --help
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority-scan "$SDIST_ROOT/atlas/public_mcp_schemas.json" \
            --format json --output authority-report.json
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority diff authority-report.json authority-report.json \
            --fail-on-increase
          env -u PYTHONPATH -u PYTHONHOME \
            verb-authority-diff authority-report.json authority-report.json \
            --format json --output authority-diff.json
          cp "$SDIST_ROOT/scripts/installed_wheel_smoke.py" installed_wheel_smoke.py
          expected_version=$(env -u PYTHONPATH -u PYTHONHOME python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$SDIST_ROOT/pyproject.toml")
          env -u PYTHONPATH -u PYTHONHOME \
            python -I installed_wheel_smoke.py \
            --expected-version "$expected_version" \
            --forbid-root "${{ github.workspace }}" \
            --forbid-root "$SDIST_ROOT"
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -c 'import json; assert json.load(open("authority-report.json"))["summary"]["tools"] == 10'
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -c 'import json; assert json.load(open("authority-diff.json"))["summary"]["changes"] == 0'
          env -u PYTHONPATH -u PYTHONHOME \
            python -I -m pip check
          test ! -e installed-smoke-shadow.marker

      - name: Smoke-test local composite action
        uses: ./
        with:
          before: ${{ runner.temp }}/authority-report.json
          after: ${{ runner.temp }}/authority-report.json
          fail_on_increase: "true"
          fail_on_review: "true"

      - name: Preserve distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  action-shadowing:
    name: Composite action ignores consumer module shadowing
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out action below the consumer workspace
        uses: actions/checkout@v7
        with:
          path: verb-authority-action

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create a hostile consumer module and a widening schema diff
        shell: bash
        run: |
          printf '%s\n' \
            'from pathlib import Path' \
            'Path("shadow-imported.marker").write_text("consumer module ran", encoding="utf-8")' \
            'raise SystemExit(0)' \
            > verb_authority.py
          printf '%s\n' \
            'from pathlib import Path' \
            'Path("pip-shadow-imported.marker").write_text("consumer pip module ran", encoding="utf-8")' \
            'raise SystemExit(0)' \
            > pip.py
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","maximum":10}},"required":["amount"]}}]}' \
            > before.json
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","maximum":10}},"required":["amount"]}}]}' \
            > ./--help
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","maximum":100}},"required":["amount"]}}]}' \
            > after.json
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","maximum":1}},"required":["amount"]}}]}' \
            > option-before.json
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","minimum":0}},"required":["amount"]}}]}' \
            > review-before.json
          printf '%s\n' \
            '{"tools":[{"name":"set_limit","inputSchema":{"type":"object","properties":{"amount":{"type":"number","minimum":-100}},"required":["amount"]}}]}' \
            > review-after.json

      - name: Run the composite action from the hostile workspace
        id: authority-diff
        continue-on-error: true
        uses: ./verb-authority-action
        with:
          before: before.json
          after: after.json
          fail_on_increase: "true"
          fail_on_review: "false"

      - name: Run the composite action on review-only drift
        id: authority-review
        continue-on-error: true
        uses: ./verb-authority-action
        with:
          before: review-before.json
          after: review-after.json
          fail_on_increase: "false"
          fail_on_review: "true"

      - name: Treat an option-looking baseline as a schema path
        id: authority-option-before
        continue-on-error: true
        uses: ./verb-authority-action
        with:
          before: --help
          after: after.json
          fail_on_increase: "true"
          fail_on_review: "false"

      - name: Treat an option-looking candidate as a schema path
        id: authority-option-after
        continue-on-error: true
        uses: ./verb-authority-action
        with:
          before: option-before.json
          after: --help
          fail_on_increase: "true"
          fail_on_review: "false"

      - name: Verify the installed CLI enforced both real thresholds
        if: always()
        shell: bash
        env:
          INCREASE_OUTCOME: ${{ steps.authority-diff.outcome }}
          REVIEW_OUTCOME: ${{ steps.authority-review.outcome }}
          OPTION_BEFORE_OUTCOME: ${{ steps.authority-option-before.outcome }}
          OPTION_AFTER_OUTCOME: ${{ steps.authority-option-after.outcome }}
        run: |
          test "$INCREASE_OUTCOME" = "failure"
          test "$REVIEW_OUTCOME" = "failure"
          test "$OPTION_BEFORE_OUTCOME" = "failure"
          test "$OPTION_AFTER_OUTCOME" = "failure"
          test ! -e shadow-imported.marker
          test ! -e pip-shadow-imported.marker
