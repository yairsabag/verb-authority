[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verb-authority"
version = "0.10.0b8"
description = "A Python gate that prevents untrusted agent data from authoring sensitive tool-call arguments—without classifying prompts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "agent-security",
  "ai-agents",
  "information-flow-control",
  "llm-security",
  "prompt-injection",
  "tool-calling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
verb-authority = "verb_authority:main"
verb-authority-scan = "verb_authority_scan:main"
verb-authority-diff = "verb_authority_diff:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/yairsabag/verb-authority"
Issues = "https://github.com/yairsabag/verb-authority/issues"

[tool.setuptools]
py-modules = ["verb_authority", "verb_authority_scan", "verb_authority_diff"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
